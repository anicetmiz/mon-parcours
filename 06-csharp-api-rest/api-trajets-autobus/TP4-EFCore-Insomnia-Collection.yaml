                insomnia.test('Response has the required fields', function () {
                    const responseData = insomnia.response.json();
                    insomnia.expect(responseData).to.be.an('object');
                    insomnia.expect(responseData).to.have.property('id');
                    insomnia.expect(responseData).to.have.property('nom');
                    insomnia.expect(responseData).to.have.property('pointsArret');
                    insomnia.expect(responseData).to.have.property('dateCreationTrajet');
                    insomnia.expect(responseData).to.have.property('dateDerniereModification');
                })

                insomnia.test('ID is a non-negative integer', function () {
                    const responseData = insomnia.response.json();
                    insomnia.expect(responseData.id).to.be.a('number');
                    insomnia.expect(responseData.id).to.be.at.least(0, 'ID should be a non-negative integer');
                })

                insomnia.test('PointsArret is an array is empty', function () {
                    const responseData = insomnia.response.json();
                    insomnia.expect(responseData).to.be.an('object');
                    insomnia.expect(responseData.pointsArret).to.be.an('array').and.to.be.empty;
                })
